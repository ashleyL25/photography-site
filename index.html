<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the page fill the screen right to the physical
         edges on notched iPhones, and is what makes the `env(safe-area-inset-*)`
         values non-zero. Anything pinned to an edge has to pad past its inset —
         see the header in src/components/Header.tsx. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Ashley Photography — Senior, Couple &amp; Family Portraits in Des Moines, Iowa</title>
    <meta
      name="description"
      content="Natural-light portrait photography based in Urbandale, serving the Des Moines metro and central Iowa. Senior pictures, graduation, engagements, couples, families and pets — unhurried sessions, honest edits."
    />
    <!-- Kept in step with the site's own theme by the script below and by
         `useTheme` — NOT with `prefers-color-scheme`, because the palette is a
         class the visitor can toggle, and a media-keyed value leaves the browser
         chrome dark for someone reading in light mode on a dark phone. -->
    <meta name="theme-color" id="theme-color" content="#F0E8E1" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ashley Photography — Central Iowa Portrait Photographer" />
    <meta
      property="og:description"
      content="Senior pictures, graduation, engagements, couples, families and pets. Based in Urbandale, traveling across central Iowa and beyond."
    />
    <meta property="og:image" content="/photos/engagement/june2022-54-1440.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Lora:ital,wght@0,400..600;1,400..500&family=Oswald:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Hero plate. Mirrors the srcset the Photo component renders so the
         browser preloads the same file it will actually use. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/photos/engagement/june2022-54-1440.webp"
      imagesrcset="
        /photos/engagement/june2022-54-480.webp   480w,
        /photos/engagement/june2022-54-960.webp   960w,
        /photos/engagement/june2022-54-1440.webp 1440w,
        /photos/engagement/june2022-54-2000.webp 2000w,
        /photos/engagement/june2022-54-2600.webp 2600w"
      imagesizes="100vw"
    />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      ;(() => {
        const stored = localStorage.getItem('ap-theme')
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
        // Must match --canvas for each palette in src/index.css.
        document
          .getElementById('theme-color')
          .setAttribute('content', dark ? '#16180F' : '#F0E8E1')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
